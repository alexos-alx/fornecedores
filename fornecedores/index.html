<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polipet | Fornecedores</title>
<style>html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center}.loading div{max-width:420px;padding:24px}.error{color:#fecaca}</style>
</head>
<body>
<div class="loading"><div><h2>Polipet</h2><p>Carregando fornecedores...</p></div></div>
<script>
(async()=>{
  try{
    const url='https://dreqidkohffwlhjtnexd.supabase.co/storage/v1/object/public/fornecedores-polipet/index.html?v='+Date.now();
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('Falha ao carregar a aplicação ('+r.status+').');
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading"><div><h2>Não foi possível abrir o sistema.</h2><p class="error">'+String(e.message||e)+'</p><p>Tente atualizar a página.</p></div></div>';
  }
})();
</script>
</body>
</html>
