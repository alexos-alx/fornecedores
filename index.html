<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polipet | Fornecedores Online</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07111f;color:#fff;font-family:Arial,sans-serif}.loading{height:100%;display:grid;place-items:center}.box{text-align:center}.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.18);border-top-color:#38bdf8;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#9fb0c8;font-size:13px}
</style>
</head>
<body>
<div class="loading"><div class="box"><div class="spin"></div><strong>Carregando Fornecedores Polipet</strong><p>Conectando à base compartilhada...</p></div></div>
<script>
(async()=>{try{
  const u='https://dreqidkohffwlhjtnexd.supabase.co/functions/v1/fornecedores-polipet-app?v='+Date.now();
  const r=await fetch(u,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  let h=await r.text();

  const oldSortStart=h.indexOf('<style>\n.table-sortable-head');
  if(oldSortStart>=0){
    const oldSortEnd=h.indexOf('<'+'/script>',oldSortStart);
    if(oldSortEnd>=0)h=h.slice(0,oldSortStart)+h.slice(oldSortEnd+9);
  }

  h=h.replace(
    "selectedId=null,pendingConfirm=null,syncTimer=null;",
    "selectedId=null,pendingConfirm=null,syncTimer=null,tableSort={key:null,dir:'asc'};"
  );

  h=h.replace(
    '<th>Cód.</th><th>Fornecedor</th><th>Sistemática</th><th>Comprador</th><th>Responsável</th><th>Pedido mínimo</th><th class="num">Média vendas/mês</th><th class="num">Ref. compra 70%</th><th>Status</th><th>Feito por</th>',
    '<th data-sort="code">Cód. <span class="sort-indicator">↕</span></th><th data-sort="short_name">Fornecedor <span class="sort-indicator">↕</span></th><th data-sort="systematic">Sistemática <span class="sort-indicator">↕</span></th><th data-sort="buyer">Comprador <span class="sort-indicator">↕</span></th><th data-sort="contact_name">Responsável <span class="sort-indicator">↕</span></th><th data-sort="min_order">Pedido mínimo <span class="sort-indicator">↕</span></th><th class="num" data-sort="avg_monthly_sales">Média vendas/mês <span class="sort-indicator">↕</span></th><th class="num" data-sort="ref70">Ref. compra 70% <span class="sort-indicator">↕</span></th><th data-sort="status">Status <span class="sort-indicator">↕</span></th><th data-sort="handled_by">Feito por <span class="sort-indicator">↕</span></th>'
  );

  h=h.replace('</head>',`<style>
th[data-sort]{cursor:pointer;user-select:none;white-space:nowrap}
th[data-sort]:hover{filter:brightness(1.08)}
.sort-indicator{display:inline-block;margin-left:5px;min-width:10px;font-size:9px;opacity:.45}
.sort-indicator.active{opacity:1}
</style></head>`);

  const helpers=String.raw`
function tableSortValue(s,key){
 if(key==='code'){let raw=String(s.code??''),d=raw.replace(/\D/g,'');return d?Number(d):raw}
 if(key==='short_name')return s.short_name||'';
 if(key==='systematic')return s.systematic||'';
 if(key==='buyer')return uidName(s.assigned_buyer)||'';
 if(key==='contact_name')return s.contact_name||'';
 if(key==='min_order')return Number(s.min_order||0);
 if(key==='avg_monthly_sales')return Number(s.avg_monthly_sales||0);
 if(key==='ref70')return Number(s.avg_monthly_sales||0)*.70;
 if(key==='status'){let st=statusFor(s.id)?.status||'pending';return st==='in_progress'?'EM ANDAMENTO':st==='ok'?'PEDIDO OK':'PENDENTE'}
 if(key==='handled_by')return uidName(statusFor(s.id)?.handled_by)||'';
 return ''
}
function sortedTableList(list){
 if(!tableSort.key)return list.slice();
 let dir=tableSort.dir==='desc'?-1:1,key=tableSort.key;
 return list.map((s,i)=>({s,i})).sort((a,b)=>{
   let av=tableSortValue(a.s,key),bv=tableSortValue(b.s,key),c=0;
   if(typeof av==='number'&&typeof bv==='number')c=av-bv;
   else c=String(av??'').localeCompare(String(bv??''),'pt-BR',{numeric:true,sensitivity:'base'});
   return c===0?a.i-b.i:c*dir
 }).map(x=>x.s)
}
function updateTableSortHeaders(){
 document.querySelectorAll('th[data-sort]').forEach(th=>{
   let ind=th.querySelector('.sort-indicator'),active=th.dataset.sort===tableSort.key;
   if(ind){ind.textContent=active?(tableSort.dir==='asc'?'↑':'↓'):'↕';ind.classList.toggle('active',active)}
   th.setAttribute('aria-sort',active?(tableSort.dir==='asc'?'ascending':'descending'):'none')
 })
}
`;
  h=h.replace('function render(){',helpers+'\nfunction render(){');
  h=h.replace('renderDetail();renderTable(list)','renderDetail();renderTable(sortedTableList(list));updateTableSortHeaders()');

  const headerHandler="document.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>{let key=th.dataset.sort;if(tableSort.key===key)tableSort.dir=tableSort.dir==='asc'?'desc':'asc';else{tableSort.key=key;tableSort.dir='asc'}render()}));\n";
  h=h.replace("document.addEventListener('click',e=>{let x;",headerHandler+"document.addEventListener('click',e=>{let x;");

  document.open();document.write(h);document.close();
}catch(e){document.body.innerHTML='<div class="loading"><div class="box"><strong>Não foi possível carregar o sistema.</strong><p>'+String(e.message||e)+'</p></div></div>'}})();
</script>
</body>
</html>
